# Local development stack.
#
# Mirrors the managed services used in production (Supabase PostgreSQL and
# MongoDB Atlas) so that developers exercise the same drivers, dialects and
# failure modes locally. `depends_on: service_healthy` means the API never
# starts against a database that is still initialising.

name: market-intel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-market_intel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-market_intel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-market_intel}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-network hostnames override whatever .env holds for host runs.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-mongo}:${MONGO_ROOT_PASSWORD:-mongo}@mongo:27017/?authSource=admin
      # Ollama runs on the host, not in the compose network -- it needs the
      # machine's memory and the model cache, neither of which belongs in an
      # image. Inside a container "localhost" is the container, so the .env
      # default silently reaches nothing and every briefing degrades to raw
      # evidence. The gateway alias is what actually finds the host's Ollama.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    # Source is bind-mounted and uvicorn reloads, so local edits apply without
    # a rebuild. The production image ships the code baked in instead.
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --no-access-log

  web:
    # The Next.js standalone server. The browser calls the API directly rather
    # than through a reverse proxy, so CORS_ORIGINS on the API is what makes
    # this work -- see the api service's env_file.
    build:
      context: ./web
      dockerfile: Dockerfile
      target: runtime
      args:
        # Baked into the client bundle at build time, not read at runtime.
        # Changing it requires rebuilding the image.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  worker:
    # The scheduler runs as its own process. Embedding it in the API would run
    # every job once per API replica, and a long ingestion run would compete
    # with request handling for the same event loop.
    #
    # Built with the `ml` extra, unlike the API: sentiment scoring runs here, so
    # this is the only image that needs torch. The API stays lean.
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
      args:
        INSTALL_ML: "${INSTALL_ML:-true}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-mongo}:${MONGO_ROOT_PASSWORD:-mongo}@mongo:27017/?authSource=admin
      ANALYSIS_USE_FINBERT: "${ANALYSIS_USE_FINBERT:-true}"
      # Ollama runs on the host, not in the compose network -- it needs the
      # machine's memory and the model cache, neither of which belongs in an
      # image. Inside a container "localhost" is the container, so the .env
      # default silently reaches nothing and every briefing degrades to raw
      # evidence. The gateway alias is what actually finds the host's Ollama.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      # Model weights persist across restarts. Without this the worker
      # re-downloads 440MB from Hugging Face on every container recreate.
      - huggingface_cache:/app/.cache/huggingface
    command: ["python", "-m", "app.workers"]
    healthcheck:
      # The worker serves no HTTP. It rewrites a heartbeat file from inside the
      # scheduler, so a stale file means the event loop stopped dispatching --
      # which a process check would never notice. Uses the image's own Python
      # rather than pgrep, which the slim base does not ship.
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, time
          p = "/tmp/worker-heartbeat"
          sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 120 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  mongo_data:
  huggingface_cache:
