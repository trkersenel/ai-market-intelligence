# Serves the built assets and proxies the API on the same origin.
#
# Same-origin matters: the browser makes no CORS preflight, the bundle carries no
# absolute backend URL, and the identical build runs in dev, in compose and
# behind any reverse proxy.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames are immutable by construction, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached: it is the document that points at the
    # current asset hashes, so a stale copy pins a visitor to a deleted bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade, for the price stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A streaming connection must not be closed by an idle timeout tuned for
        # request/response traffic.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health/ {
        proxy_pass http://api:8000;
        access_log off;
    }

    # Client-side routing: an unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
