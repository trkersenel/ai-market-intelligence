; Alembic configuration.
;
; The database URL is intentionally absent: it is resolved at runtime from the
; application settings in alembic/env.py, so migrations and the application can
; never disagree about which database they target.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

; No post-write formatting hook.
;
; Alembic can format generated migrations, but neither hook type works reliably
; for ruff: it ships a compiled binary rather than a `console_scripts` entry
; point, and the `exec` type needs it resolvable on PATH -- which it is not
; inside a virtualenv, nor in the runtime image where dev dependencies are
; absent. Migrations are formatted by `make format` and by the pre-commit hook,
; both of which already cover `backend/`, and CI verifies the result. One
; formatting path, no environment-dependent failures.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
